<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>FC Learner Portal</title><link rel="icon" href="/fc-logo.png">
<style>
/* Layout: exam desk. Header strip, mock picker as three paper-like cards; exam = one question card + numbered grid; results = score then section bars then review. */
:root{
  --bg:#EEF1F4; --paper:#FFFFFF; --sunk:#E3E8ED; --ink:#14212B; --muted:#5B6B78; --line:#D3DBE2;
  --flue:#0E5A86; --flue-ink:#FFFFFF; --flue-soft:#E3EEF6; --flame:#D98A12; --flame-soft:#FBEFD9;
  --ok:#13704A; --ok-bg:#E2F3EA; --bad:#B42318; --bad-bg:#FCE9E7;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --wm:.05;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D151C; --paper:#15212B; --sunk:#101A22; --ink:#E4EBF0; --muted:#94A4B1; --line:#253441;
  --flue:#5BA8DA; --flue-ink:#08121A; --flue-soft:#12293A; --flame:#F2B04A; --flame-soft:#3A2B12;
  --ok:#6FD3A0; --ok-bg:#12301F; --bad:#FF8E82; --bad-bg:#3A1A17; --wm:.06; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D151C; --paper:#15212B; --sunk:#101A22; --ink:#E4EBF0; --muted:#94A4B1; --line:#253441;
  --flue:#5BA8DA; --flue-ink:#08121A; --flue-soft:#12293A; --flame:#F2B04A; --flame-soft:#3A2B12;
  --ok:#6FD3A0; --ok-bg:#12301F; --bad:#FF8E82; --bad-bg:#3A1A17; --wm:.06; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:16px/1.55 var(--f-body);min-height:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wm{position:fixed;inset:auto -60px -60px auto;width:420px;height:420px;opacity:var(--wm);pointer-events:none;z-index:0;background:url("/fc-logo.png") center/contain no-repeat}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar img{width:38px;height:38px;border-radius:50%;flex:none}
.bar .t{flex:1;min-width:150px}
.bar .t small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar .t b{font-family:var(--f-display);font-size:18px}
.timer{font-family:var(--f-mono);font-size:15px;background:var(--sunk);border-radius:6px;padding:4px 10px}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--flue);border-color:var(--flue);color:var(--flue-ink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-within,.cell:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.intro{padding-block:28px 8px;display:grid;gap:8px}
.intro h1{font-size:clamp(28px,5vw,40px)}
.intro p{margin:0;color:var(--muted);max-width:62ch}
.mocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:18px}
.mock > .btn.primary{margin-top:auto;background:var(--flue-soft);color:var(--flue);border:2px solid var(--flue);font-weight:700;transition:background .15s,color .15s}
.mock > .btn.primary:hover,.mock > .btn.primary:focus-visible{background:var(--flue);color:var(--flue-ink)}
.rbtn{display:inline-block;align-self:flex-start;margin-top:auto;padding:9px 16px;border-radius:8px;border:2px solid var(--flue);background:var(--flue-soft);color:var(--flue);font-weight:700;line-height:1.2;transition:background .15s,color .15s}
.res:hover .rbtn,.res:focus-visible .rbtn{background:var(--flue);color:var(--flue-ink)}
.res:hover{border-color:var(--flue)}
.res:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.mock{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mock .k{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--flue)}
.mock .meta{font-size:14px;color:var(--muted)}
.mock .best{font-size:14px}
.how{margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.how h3{font-size:16px;margin-bottom:6px}
.how ul{margin:0;padding-left:20px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--flame-soft);color:var(--flame)}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:20px;display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qnum{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.qtext{font-size:19px;font-weight:600;line-height:1.45;margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:var(--paper)}
.opt:hover{border-color:var(--muted)}
.opt input{margin-top:4px;accent-color:var(--flue);flex:none}
.opt .l{font-family:var(--f-mono);color:var(--muted);flex:none}
.opt.sel{border-color:var(--flue);background:var(--sunk)}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:14px}
.cell{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 0;text-align:center;font-family:var(--f-mono);font-size:13px;cursor:pointer}
.topx{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px}
.topx h3{font-size:16px;margin:0} .topx p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tbtn{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;font-size:14.5px;font-weight:600;padding:9px 12px;border-radius:8px;border:2px solid var(--flue);background:var(--flue-soft);color:var(--flue);cursor:pointer}
.tbtn:hover,.tbtn:focus-visible{background:var(--flue);color:var(--flue-ink)}
.tbtn .tn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--flue);color:var(--flue-ink);font-size:12.5px}
.tbtn:hover .tn,.tbtn:focus-visible .tn{background:var(--flue-ink);color:var(--flue)}
.tbtn:disabled{opacity:.6;cursor:wait}
.gtop{grid-column:1/-1;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.gtop:first-child{margin-top:0}
.cell.done{background:var(--flue);border-color:var(--flue);color:var(--flue-ink)}
.cell.cur{outline:2px solid var(--flame);outline-offset:1px}
.cell.flag{box-shadow:inset 0 -4px 0 var(--flame)}
.legend{font-size:13px;color:var(--muted);margin-top:8px}
.score{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:20px;display:grid;gap:6px}
.score .big{font-family:var(--f-display);font-size:56px;line-height:1}
.score p{margin:0;color:var(--muted)}
.score .pill{justify-self:start}
.secs{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px;display:grid;gap:10px}
.sec{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center}
.sec .n{font-size:15px}
.sec .v{font-family:var(--f-mono);font-size:14px;text-align:right}
.meter{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px}
.review{display:grid;gap:10px;margin-top:14px}
.rv{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.rv.x{border-left-color:var(--bad)}
.rv .q{font-weight:600;margin:0}
.rv .a{font-size:15px;margin:0}
.rv .a b.ok{color:var(--ok)} .rv .a b.bad{color:var(--bad)}
.rv .e{font-size:15px;margin:0;color:var(--muted)}
.rv .r{font-size:13px;margin:0;font-family:var(--f-mono);color:var(--flue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.confirm{background:var(--flame-soft);border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.confirm p{margin:0;flex:1;min-width:200px}
footer{margin-top:32px;font-size:13px;color:var(--muted);display:grid;gap:4px}
@media (max-width:520px){.qtext{font-size:17px}.score .big{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.auth{max-width:420px;margin:40px auto 0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px;display:grid;gap:14px}
.auth h1{font-size:26px}
.auth p{margin:0;color:var(--muted)}
.field{display:grid;gap:5px}
.field label{font-weight:600;font-size:14px}
.field input{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit;width:100%}
.field input:focus-visible{outline:2px solid var(--flame);outline-offset:1px}
.err{color:var(--bad);font-weight:600;font-size:14px;margin:0}
.hist{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;overflow-x:auto}
.hist table{border-collapse:collapse;width:100%;font-size:15px}
.hist th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.hist td{padding:10px 14px;border-bottom:1px solid var(--line)}
.hist tr:last-child td{border-bottom:0}
.linkbtn{background:none;border:0;color:var(--flue);font-weight:600;cursor:pointer;padding:0}
.saving{font-size:13px;color:var(--muted)}
.gopts{display:grid;gap:8px}
.gopt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.gopt:hover:not(:disabled){border-color:var(--flue);background:var(--flue-soft)}
.gopt:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.gopt:disabled{cursor:default}
.gopt .l{font-family:var(--f-mono);color:var(--muted);flex:none}
.gopt.right{border-color:var(--ok);background:var(--ok-bg)}
.gopt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:8px;padding:12px 14px;background:var(--sunk);display:grid;gap:6px}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.fb .r{font-family:var(--f-mono);font-size:13px;color:var(--flue)}
.gk{font-size:30px !important}
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}
.boards h3{font-size:15px;padding:12px 14px 0;margin:0}
.boards .hist{margin-top:0}
.boards td.me{font-weight:700}
.sow{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:12px;display:grid;gap:10px}
.sow select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);color:var(--ink);font:inherit;width:100%;max-width:560px}
.sow .wk{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--flame)}
.sow h3{font-size:18px;margin:0}
.sow dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
.sow dt{color:var(--muted)} .sow dd{margin:0}
.sow .acts{display:flex;gap:8px;flex-wrap:wrap}
.sow .acts .btn{font-weight:700;background:var(--flue-soft);color:var(--flue);border:2px solid var(--flue);transition:background .15s,color .15s}
.sow .acts .btn:hover,.sow .acts .btn:focus-visible{background:var(--flue);color:var(--flue-ink)}
</style>
</head><body>
<div class="wm" aria-hidden="true"></div>
<header class="top"><div class="bar">
  <img src="/fc-logo.png" alt="FC Training Academy">
  <div class="t"><small>FC Training Academy</small><b id="htitle">Learner Portal</b></div>
  <span class="timer" id="timer" hidden></span>
  <span class="saving" id="saving" hidden></span>
  <button class="btn ghost" id="home" hidden>My exams</button>
  <button class="btn ghost" id="out" hidden>Sign out</button>
</div></header>
<main class="wrap" id="app"><div class="auth"><p>Loading…</p></div></main>

<script>
(() => {
"use strict";
const app = document.getElementById("app"), timerEl = document.getElementById("timer"), savingEl = document.getElementById("saving"),
  homeBtn = document.getElementById("home"), outBtn = document.getElementById("out"), htitle = document.getElementById("htitle");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LETTERS = ["A","B","C","D"];
const fmtDate = d => new Date(d).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
const PREVIEW = new URLSearchParams(location.search).get("preview") === "1";
async function api(method, url, body){
  const h = body ? {"Content-Type":"application/json"} : {}; if (PREVIEW) h["X-Preview"] = "1";
  const r = await fetch(url, { method, headers: h, body: body ? JSON.stringify(body) : undefined, credentials: "same-origin" });
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok) { const e = new Error(j.error || "Something went wrong. Try again."); e.status = r.status; throw e; }
  return j;
}
let ME = null, X = null, tick = null, saveT = null;
function chrome(signedIn, inExam){ outBtn.hidden = !signedIn; homeBtn.hidden = !inExam; timerEl.hidden = !inExam; if (!inExam){ clearInterval(tick); savingEl.hidden = true; } }
const footer = `<footer><span>© FC Training Academy. Practice questions written by FC Training Academy for learner revision. They are not LCL Awards assessment papers.</span><span>Always check answers against the current edition of the standard and the manufacturer's instructions.</span></footer>`;

/* ---------- sign in / invite ---------- */
function showLogin(msg){
  chrome(false,false); htitle.textContent = "Learner Portal";
  app.innerHTML = `<form class="auth" id="login" novalidate><h1>Sign in</h1><p>Use the email address you gave FC Training Academy and the password you set.</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    ${msg?`<p class="err" id="err">${esc(msg)}</p>`:`<p class="err" id="err" hidden></p>`}
    <button class="btn primary" type="submit">Sign in</button>
    <p style="font-size:14px">No password yet, or forgotten it? Ask FC Training Academy to send you a new portal link.</p></form>${footer}`;
  document.getElementById("login").onsubmit = async e => { e.preventDefault(); const err = document.getElementById("err");
    try { await api("POST","/api/learn/login",{ email: document.getElementById("em").value, password: document.getElementById("pw").value }); await boot(); }
    catch(x){ err.hidden = false; err.textContent = x.message; } };
}
async function showInvite(token){
  chrome(false,false);
  let info; try { info = await api("GET","/api/learn/invite/"+encodeURIComponent(token)); } catch(x){ history.replaceState(null,"","/learn/"); return showLogin(x.message); }
  app.innerHTML = `<form class="auth" id="inv" novalidate><h1>Welcome${info.name?", "+esc(info.name.split(" ")[0]):""}</h1>
    <p>Set a password for the FC Training Academy learner portal. Your username is <b>${esc(info.email)}</b>.</p>
    <div class="field"><label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password" required><span style="font-size:13px;color:var(--muted)">At least 10 characters, with letters and numbers.</span></div>
    <div class="field"><label for="p2">Type it again</label><input id="p2" type="password" autocomplete="new-password" required></div>
    <p class="err" id="err" hidden></p><button class="btn primary" type="submit">Set password and sign in</button></form>${footer}`;
  document.getElementById("inv").onsubmit = async e => { e.preventDefault(); const err = document.getElementById("err"); const a = document.getElementById("p1").value, b = document.getElementById("p2").value;
    if (a !== b){ err.hidden = false; err.textContent = "The two passwords don't match."; return; }
    try { await api("POST","/api/learn/invite/"+encodeURIComponent(token),{ password: a }); history.replaceState(null,"","/learn/"); await boot(); }
    catch(x){ err.hidden = false; err.textContent = x.message; } };
}

/* ---------- home ---------- */
async function home(){
  try { ME = await api("GET","/api/learn/me"); } catch(x){ return showLogin(PREVIEW ? "Preview needs you to be signed in to the LMS as Manager or Admin in this browser. Sign in to the LMS, then press Preview learner portal again." : undefined); }
  chrome(true,false); htitle.textContent = "Learner Portal"; X = null; G = null; clearInterval(gtick); homeBtn.textContent = "My exams";
  const best = {}; ME.attempts.forEach(a => { if (best[a.mock]==null || a.pct > best[a.mock]) best[a.mock] = a.pct; });
  const cards = ME.mocks.map(m => `<div class="mock"><div class="k">${esc(m.id)}</div><h2 style="font-size:20px">Mock exam ${esc(m.id)}</h2>
    <div class="meta">${m.count} questions · ${m.minutes} minutes · every topic, in Scheme of Work order</div>
    <div class="best">${best[m.id]!=null?`Your best: <b class="mono">${best[m.id]}%</b>`:`<span style="color:var(--muted)">Not attempted yet</span>`}</div>
    ${ME.open && ME.open.mock===m.id?`<button class="btn primary" data-resume="${ME.open.id}">Continue mock ${esc(m.id)}</button>`:`<button class="btn primary" data-start="${esc(m.id)}">Start mock ${esc(m.id)}</button>`}</div>`).join("");
  const hist = ME.attempts.length ? `<div class="hist"><table><thead><tr><th>Date</th><th>Mock</th><th>Score</th><th></th></tr></thead><tbody>${ME.attempts.map(a => `<tr><td>${fmtDate(a.finished_at)}</td><td>${esc(a.mock)}</td><td class="mono">${a.score}/${a.total} · ${a.pct}%</td><td><button class="linkbtn" data-view="${a.id}">Review</button></td></tr>`).join("")}</tbody></table></div>`
    : `<p style="color:var(--muted);margin-top:10px">Your results will appear here after your first mock.</p>`;
  app.innerHTML = `${ME.learner.preview?`<div class="confirm" style="margin-top:18px"><p><b>Preview mode.</b> You're seeing the portal as a learner sees it, signed in with your staff login. Mock attempts you take here are not saved to any learner.</p></div>`:""}<section class="intro"><span class="pill">${esc(ME.learner.cohort || "FC Training Academy")}</span>
    <h1>Hello ${esc(ME.learner.name.split(" ")[0])}</h1>
    <p>Practise for your CCN1 / ACS assessment. Each mock covers every section of the CCN1 Practical Performance Criteria. Your tutor can see your scores so they can help with the areas you find hardest.</p></section>
    <div class="mocks">${cards}</div>
    ${(ME.topics||[]).length?`<div class="topx"><h3>Practise one topic</h3><p>Questions on a single topic, in Scheme of Work order. Instant feedback after each answer.</p><div class="tlist">${ME.topics.map((t,k) => `<button class="tbtn" data-game="practice" data-secs="${esc(t.s)}" data-label="${esc(t.name)}"><span class="tn mono">${k+1}</span>${esc(t.name)}</button>`).join("")}</div></div>`:""}
    <h2 id="resources" style="font-size:20px;margin-top:28px;scroll-margin-top:80px">Resources</h2><div id="sowbox"></div><div id="res"><p style="color:var(--muted)">Loading…</p></div>
    <h2 style="font-size:20px;margin-top:28px">Games</h2>
    <p style="margin:6px 0 0;color:var(--muted)">Quick rounds built on the mock questions. Play for fun, learn from every answer.</p>
    <div class="mocks">${GAMES.map(g => `<div class="mock"><div class="k gk">${g.icon}</div><h2 style="font-size:20px">${esc(g.name)}</h2><div class="meta">${esc(g.meta)}</div><button class="btn primary" data-game="${g.mode}">${esc(g.btn)}</button></div>`).join("")}</div>
    <div id="board"></div>
    <h2 style="font-size:20px;margin-top:28px">Your results</h2>${hist}
    <div class="how"><h3>How it works</h3><ul>
      <li>One answer per question. Your answers save as you go, so you can close the page and come back before the time runs out.</li>
      <li>You have ${ME.mocks[0]?ME.mocks[0].minutes:45} minutes. When the time is up, the exam is marked with the answers you saved.</li>

  const box = document.getElementById("board"); if (!box) return;
  try { const B = await api("GET","/api/learn/game/board");
    const row = (cells) => `<tr>${cells.map(c=>`<td>${c}</td>`).join("")}</tr>`;
    const t1 = B.fastest.length ? B.fastest.map((r,i)=>row([i+1, esc(r.name), `<span class="mono">${fmtMs(r.ms)}</span>`])).join("") : `<tr><td colspan="3" style="color:var(--muted)">No perfect runs yet. Be the first.</td></tr>`;
    const t2 = B.streak.length ? B.streak.map((r,i)=>row([i+1, esc(r.name), `<span class="mono">${r.score}</span>`])).join("") : `<tr><td colspan="3" style="color:var(--muted)">No streaks yet.</td></tr>`;
    const mine = [B.mine && B.mine.best_ms!=null ? `your fastest perfect run <b class="mono">${fmtMs(B.mine.best_ms)}</b>` : "", B.mine && B.mine.best_streak ? `your best streak <b class="mono">${B.mine.best_streak}</b>` : ""].filter(Boolean).join(" · ");
    box.innerHTML = `<div class="boards"><div class="hist"><h3>Fastest perfect runs</h3><table><thead><tr><th>#</th><th>Name</th><th>Time</th></tr></thead><tbody>${t1}</tbody></table></div>
      <div class="hist"><h3>Longest streaks</h3><table><thead><tr><th>#</th><th>Name</th><th>Streak</th></tr></thead><tbody>${t2}</tbody></table></div></div>
      ${mine?`<p style="margin:8px 0 0;color:var(--muted)">Your best: ${mine}</p>`:""}`;
  } catch(x){ box.innerHTML = ""; }
}
async function startGame(mode, secs, label){
  const body = { mode }; if (secs){ body.sections = secs.split(",").filter(Boolean); body.label = label; }
  const g = await api("POST","/api/learn/game/start", body);
  G = { id: g.id, mode: g.mode, scope: g.scope, secs, label, qs: g.questions, total: g.total, i: 0, score: 0, fb: null, busy: false, t0: Date.now() };
  chrome(true,true); homeBtn.textContent = "Leave game"; clearInterval(gtick);
  if (G.mode === "challenge"){ timerEl.hidden = false; timerEl.classList.remove("low"); const tk = () => { timerEl.textContent = fmtMs(Date.now()-G.t0); }; tk(); gtick = setInterval(tk, 250); }
  else timerEl.hidden = true;
  htitle.textContent = G.scope || GAMES.find(x=>x.mode===G.mode).name; renderG();
}
function renderG(){
  const q = G.qs[G.i], fb = G.fb;
  const prog = G.mode==="streak" ? `Streak: <b>${G.score}</b>` : `Question ${G.i+1} of ${G.total}${G.mode==="practice"?` · ${G.score} right`:""}`;
  app.innerHTML = `<div class="qcard"><div class="qhead"><span class="qnum">${prog}</span><span class="pill">${esc(q.sec||"")}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="gopts">${q.opts.map((o,j)=>{ let c=""; if (fb){ if (j===fb.right) c=" right"; else if (j===fb.a) c=" wrong"; }
      return `<button class="gopt${c}" data-ga="${j}" ${fb||G.busy?"disabled":""}><span class="l">${LETTERS[j]}</span><span>${esc(o)}</span></button>`; }).join("")}</div>
    ${fb?`<div class="fb"><p style="margin:0">${fb.correct?`<b class="ok">Correct.</b>`:`<b class="bad">Not quite.</b> The answer is ${LETTERS[fb.right]}.`}</p><p style="margin:0">${esc(fb.e)}</p><span class="r">Read: ${esc(fb.r)}</span></div>
      <div class="nav"><span></span><button class="btn primary" data-gnext>${fb.over?"See result":"Next question"}</button></div>`:""}
  </div>${footer}`;
  window.scrollTo(0,0);
  const first = app.querySelector(fb?"[data-gnext]":".gopt"); if (first) first.focus({ preventScroll: true });
}
async function answerG(a){
  if (!G || G.busy || G.fb) return; G.busy = true;
  try {
    const r = await api("POST","/api/learn/game/"+G.id+"/answer",{ i: G.i, a });
    G.busy = false;
    if (G.mode === "challenge"){ if (r.done) return finishG(); G.i++; return renderG(); }
    G.score = r.score; G.fb = { a, right: r.right, correct: r.correct, e: r.e, r: r.r, over: r.over }; renderG();
  } catch(x){ G.busy = false; throw x; }
}
async function finishG(){
  clearInterval(gtick); const res = await api("POST","/api/learn/game/"+G.id+"/finish"); const mode = G.mode, gsecs = G.secs || "", glabel = G.label || ""; G = null;
  chrome(true,true); homeBtn.textContent = "My exams"; timerEl.hidden = true; htitle.textContent = "Game over";
  const perfect = res.score === res.total;
  let head, sub;
  if (mode==="challenge"){ head = `${res.score}/${res.total}`; sub = perfect ? `Perfect run in <b class="mono">${fmtMs(res.ms)}</b>.${res.rank?` You're number <b>${res.rank}</b> on the leaderboard.`:""}` : `Time <span class="mono">${fmtMs(res.ms)}</span>. Get all ${res.total} right to make the leaderboard.`; }
  else if (mode==="streak"){ head = `${res.score}`; sub = res.score ? `in a row before the first wrong answer.` : `Unlucky – try again.`; }
  else { head = `${res.score}/${res.total}`; sub = `right in this warm-up.`; }
  const rv = res.review.slice(0, res.answered).map((q,i)=>({q,i,ok:q.given===q.correct})).sort((a,b)=>a.ok-b.ok);
  app.innerHTML = `<div class="score"><span class="pill">${esc(res.scope || GAMES.find(x=>x.mode===mode).name)}</span><div class="big">${head}</div><p>${sub}</p>${res.scope?`<p style="font-size:14px">Practice by week – not on the leaderboard.</p>`:""}
    <div class="nav" style="margin-top:8px"><button class="btn" id="tohome">Back to portal</button><button class="btn primary" data-game="${mode}" data-secs="${esc(gsecs)}" data-label="${esc(glabel)}">Play again</button></div></div>
    <div class="review">${rv.map(({q,i,ok}) => `<div class="rv${ok?"":" x"}"><p class="q"><span class="mono" style="color:var(--muted)">${i+1}.</span> ${esc(q.q)}</p>
      <p class="a">${ok?`<b class="ok">Correct:</b> ${esc(q.opts[q.correct])}`:`<b class="bad">Your answer:</b> ${q.given==null?"not answered":esc(q.opts[q.given])}<br><b class="ok">Correct answer:</b> ${esc(q.opts[q.correct])}`}</p>
      <p class="e">${esc(q.e)}</p><p class="r">Read: ${esc(q.r)}</p></div>`).join("")}</div>${footer}`;
  window.scrollTo(0,0);
}
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  try {
    if (t.dataset.game){ t.disabled = true; return await startGame(t.dataset.game, t.dataset.secs, t.dataset.label); }
    if (t.dataset.ga!=null) return await answerG(+t.dataset.ga);
    if (t.hasAttribute("data-gnext") && G){ if (G.fb && G.fb.over) return await finishG(); G.i++; G.fb = null; return renderG(); }
  } catch(x){ if (x.status===401) return showLogin("Please sign in again."); t.disabled = false; alertBox(x.message); }
});
document.addEventListener("keydown", e => { if (!G || G.fb || G.busy) return; const k = e.key.toUpperCase(); const j = "ABCD".indexOf(k); if (j>-1 && /^[a-dA-D]$/.test(e.key) && !e.ctrlKey && !e.metaKey && document.activeElement.tagName!=="INPUT") answerG(j).catch(()=>{}); });

async function boot(){
  const inv = new URLSearchParams(location.search).get("invite");
  if (inv) return showInvite(inv);
  return home();
}
boot();
})();
</script>
